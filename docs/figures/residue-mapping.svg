<title id="figure-title">CAII residue numbering and coordinate availability</title>
<desc id="figure-desc">Eight selected canonical positions show their experimental author labels. Positions 1 and 2 have no matched experimental alpha carbon. Canonical positions 126 and 127 map to author labels 127 and 128. The plot is a positional schematic, not an atomic structure.</desc>
