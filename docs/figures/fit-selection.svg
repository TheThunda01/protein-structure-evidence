<title id="figure-title">Fit selection changes the reported structural RMSD</title>
<desc id="figure-desc">At pLDDT cutoffs zero, 70 and 90, fitted subsets contain 258, 257 and 256 pairs. Subset RMSD falls while the all-pair RMSD stays near 0.53 angstrom. Exact values are retained in fit_sensitivity.csv.</desc>
