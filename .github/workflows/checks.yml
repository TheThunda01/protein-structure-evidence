name: Check structure analysis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python analyze.py --output-dir /tmp/structure-results
      - run: python export_alignment.py --output-dir /tmp/structure-alignment
      - run: python verify_alignment.py --bundle-dir /tmp/structure-alignment --json
